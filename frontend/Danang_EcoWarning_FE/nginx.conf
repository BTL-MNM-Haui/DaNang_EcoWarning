server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  location / { try_files $uri $uri/ /index.html; }
  location /backend/reports/ { proxy_pass http://citizen-report-service:8083/; proxy_read_timeout 40s; }
  location /backend/auth/ { proxy_pass http://auth-service:8084/; }
  location /backend/data/ { proxy_pass http://search-service:8082/; }
  location /backend/collector/ { proxy_pass http://collector-data-service:8081/; proxy_read_timeout 40s; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
