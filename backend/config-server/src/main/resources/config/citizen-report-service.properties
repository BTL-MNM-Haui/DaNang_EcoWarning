# Spring Application
application.repository.query-limit-warning-ms=500

#APP
server.port=8083
logging.level.org.springframework.boot.context.config=INFO

#DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/citizen_report_service
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration (shared secret with auth-service)
jwt.secret=${JWT_SECRET_KEY}

# Redis Configuration (for JWT blacklist check)
redis.host=localhost
redis.port=6379
redis.password=${REDIS_PASSWORD}

# Server Registry (Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#JPA / HIBERNATE
#spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.ddl-auto=update

#Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}

#Swagger
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.citizen_report_service.controller
springdoc.pathsToMatch=/**

# Logging Configuration
logging.level.com.example.citizen_report_service=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=INFO
logging.level.org.springframework.web.client=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
