name: Verify application
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Danang_EcoWarning_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/Danang_EcoWarning_FE/package-lock.json
      - run: npm ci
      - run: npx eslint src/workspace src/App.jsx
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [auth-service, citizen-report-service, collector-data-service, search-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/${{ matrix.module }}/pom.xml package -DskipTests
      - if: matrix.module == 'citizen-report-service'
        run: mvn -B -f backend/citizen-report-service/pom.xml test -Dtest=IncidentSecurityTests
