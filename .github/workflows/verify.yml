name: Verify application
on:
  push:
  pull_request:
jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/requirements*.txt
      - run: pip install -r AI/requirements-dev.txt
      - run: python -m pytest -c AI/pytest.ini AI/tests/flood -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Danang_EcoWarning_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/Danang_EcoWarning_FE/package-lock.json
      - run: npm ci
      - run: npx eslint src/workspace src/App.jsx
      - run: node --test src/workspace/floodForm.test.mjs
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [auth-service, citizen-report-service, collector-data-service, search-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/${{ matrix.module }}/pom.xml package -DskipTests
      - if: matrix.module == 'auth-service'
        run: mvn -B -f backend/auth-service/pom.xml test -Dtest=MailConfigTests
      - if: matrix.module == 'citizen-report-service'
        run: mvn -B -f backend/citizen-report-service/pom.xml test -Dtest=IncidentSecurityTests

      - if: matrix.module == 'search-service'
        run: mvn -B -f backend/search-service/pom.xml test -Dtest=FloodAiControllerTests,ClimateAnomalyControllerTests,SearchServiceHelperTests,ObservationQualityTests
